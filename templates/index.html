<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Management System</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <h1>Employee Management System</h1>
    <button id="logoutBtn" class="btn outline">Logout</button>
  </header>

  <main class="container">
    <section class="stats">
      <div class="stat"><span id="statEmployees">0</span><small>Employees</small></div>
      <div class="stat"><span id="statDepartments">0</span><small>Departments</small></div>
      <div class="stat"><span id="statPayroll">0</span><small>Total Payroll</small></div>
      <div class="stat"><span id="statAverage">0</span><small>Average Salary</small></div>
    </section>

    <div id="toast" class="alert" hidden></div>

    <section class="card">
      <div class="toolbar">
        <input id="searchInput" type="search" placeholder="Search by name, email or department...">
        <button id="addBtn" class="btn primary">+ Add Employee</button>
        <button id="deptBtn" class="btn outline">Manage Departments</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th><th>Name</th><th>Email</th><th>Phone</th>
              <th>Department</th><th>Salary</th><th>Hire Date</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="employeeTable"></tbody>
        </table>
        <p id="emptyMsg" class="muted center" hidden>No employees found.</p>
      </div>
    </section>
  </main>

  <!-- Add / Edit employee -->
  <dialog id="employeeDialog">
    <form id="employeeForm" method="dialog">
      <h2 id="dialogTitle">Add Employee</h2>
      <input type="hidden" id="empId">
      <div class="grid">
        <div><label for="firstName">First name</label><input id="firstName" required></div>
        <div><label for="lastName">Last name</label><input id="lastName" required></div>
        <div><label for="email">Email</label><input id="email" type="email" required></div>
        <div><label for="phone">Phone</label><input id="phone"></div>
        <div><label for="department">Department</label><select id="department" required></select></div>
        <div><label for="salary">Salary</label><input id="salary" type="number" min="0" step="0.01" required></div>
        <div><label for="hireDate">Hire date</label><input id="hireDate" type="date"></div>
      </div>
      <p id="formError" class="alert error" hidden></p>
      <div class="actions">
        <button type="button" id="cancelBtn" class="btn outline">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Departments -->
  <dialog id="deptDialog">
    <h2>Departments</h2>
    <form id="deptForm" class="inline-form">
      <input id="deptName" placeholder="New department name" required>
      <button type="submit" class="btn primary">Add</button>
    </form>
    <p id="deptError" class="alert error" hidden></p>
    <ul id="deptList" class="dept-list"></ul>
    <div class="actions">
      <button type="button" id="deptClose" class="btn outline">Close</button>
    </div>
  </dialog>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
